[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graphrag-sec-edgar"
version = "0.6.0"
description = "GraphRAG over SEC EDGAR — knowledge graph + multi-hop traversal + vector hybrid"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "Juan David Suárez Sánchez", email = "juadsuarezsan@unal.edu.co" }]
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.32.0",
    "pydantic==2.9.2",
    "pydantic-settings==2.6.0",
    "python-dotenv==1.0.1",
    "httpx==0.27.2",
    "tenacity==9.0.0",
    "loguru==0.7.2",
    "anthropic==0.39.0",
    "neo4j==5.25.0",
    "networkx==3.4.2",
    "beautifulsoup4==4.12.3",
    "lxml==5.3.0",
    "slowapi==0.1.9",
]

[project.optional-dependencies]
# Heavy local-embedding stack (torch ~6 GB). Imported lazily inside
# `src/embeddings/local.py`; never required for tests, eval or the API.
ml = ["sentence-transformers==3.2.1"]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "pytest-cov==5.0.0",
    "pytest-mock==3.14.0",
    "respx==0.21.1",
    "ruff==0.6.9",
    "black==24.10.0",
    "mypy==1.11.2",
    "types-networkx==3.4.2.20241115",
    "lxml-stubs==0.5.1",
    "types-beautifulsoup4==4.12.0.20241020",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "eval*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py311"]
extend-exclude = "notebooks"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["slowapi.*", "sentence_transformers.*", "neo4j.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["src"]
omit = ["src/embeddings/local.py"]

[tool.coverage.report]
fail_under = 70
show_missing = true
