name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project (dev extras, no torch)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Black
        run: black --check .
      - name: Mypy (strict)
        run: mypy --strict src/
      - name: Tests with coverage (threshold 70%)
        env:
          LOG_LEVEL: WARNING
        run: pytest --cov=src --cov-report=term-missing --cov-report=xml --cov-fail-under=70
      - name: Eval regenerates RESULTS.md deterministically
        run: |
          python -m eval.run --name ci-check --out-dir /tmp/eval-runs --results /tmp/RESULTS.md
          test -s /tmp/RESULTS.md
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
