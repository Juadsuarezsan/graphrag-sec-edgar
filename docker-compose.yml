# docker compose up  -> Neo4j 5.25 (APOC) + API on :8000 with GRAPH_BACKEND=neo4j.
# Validation of this stack is pending a Docker daemon (see README "Limitaciones").
services:
  neo4j:
    image: neo4j:5.25-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-neo4j_dev}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
    ports: ["7474:7474", "7687:7687"]
    volumes: [neo4j-data:/data]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  api:
    build: .
    env_file: [.env]
    environment:
      GRAPH_BACKEND: neo4j
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-neo4j_dev}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8000}
    depends_on:
      neo4j:
        condition: service_healthy
    ports: ["8000:8000"]

volumes:
  neo4j-data:
